<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <!-- Supaya tampilannya cocok di HP -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Block Puzzle</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: linear-gradient(
        135deg,
        #eef0ff,
        #e2f5ff
      );

      font-family: Arial, sans-serif;
      color: #29253a;

      display: flex;
      justify-content: center;
    }

    .game {
      width: 94%;
      max-width: 430px;
      padding: 25px 0;
      text-align: center;
    }

    /* JUDUL */

    h1 {
      margin: 0 0 15px;
      font-size: 32px;
    }

    /* BAGIAN SKOR */

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 15px;
    }

    #score {
      font-size: 23px;
      font-weight: bold;
    }

    button {
      border: none;

      background: #29253a;
      color: white;

      padding: 13px 18px;

      border-radius: 15px;

      font-size: 15px;
      font-weight: bold;
    }

    /* PAPAN GAME */

    #board {

      display: grid;

      grid-template-columns:
        repeat(8, 1fr);

      gap: 5px;

      width: 100%;
      aspect-ratio: 1;

      padding: 7px;

      background: #c7c3d5;

      border-radius: 20px;
    }

    /* KOTAK PAPAN */

    .cell {

      background: #eeeaf5;

      border-radius: 7px;

      cursor: pointer;
    }

    /* KOTAK YANG SUDAH TERISI */

    .cell.filled {

      box-shadow:
        inset 0 -3px rgba(0,0,0,0.15);
    }

    /* TEMPAT 3 BALOK */

    #pieces {

      height: 150px;

      margin-top: 15px;

      display: flex;

      justify-content: space-around;

      align-items: center;
    }

    /* BALOK */

    .piece {

      width: 30%;
      height: 130px;

      background: rgba(255,255,255,0.7);

      border-radius: 18px;

      display: grid;

      justify-content: center;

      align-content: center;

      gap: 4px;

      cursor: pointer;
    }

    /* BALOK YANG DIPILIH */

    .piece.selected {

      outline: 4px solid #29253a;
    }

    /* KOTAK KECIL DALAM BALOK */

    .mini {

      width: 25px;
      height: 25px;

      border-radius: 5px;
    }

    /* KOTAK KOSONG */

    .empty {

      visibility: hidden;
    }

    .hint {

      color: #777;

      font-size: 14px;

      font-weight: bold;

      line-height: 1.5;
    }

    /* GAME OVER */

    #gameOver {

      display: none;

      position: fixed;

      inset: 0;

      background: rgba(30,25,45,0.65);

      justify-content: center;

      align-items: center;
    }

    .popup {

      width: 280px;

      background: white;

      padding: 30px;

      border-radius: 25px;

      text-align: center;
    }

    .popup h2 {

      margin-top: 0;
    }

  </style>
</head>


<body>


<div class="game">

  <!-- JUDUL -->

  <h1>🧱 Block Puzzle</h1>


  <!-- SKOR + TOMBOL -->

  <div class="top">

    <div id="score">
      Skor: 0
    </div>

    <button onclick="newGame()">
      Game Baru
    </button>

  </div>


  <!-- PAPAN 8 x 8 -->

  <div id="board"></div>


  <!-- 3 BALOK -->

  <div id="pieces"></div>


  <div class="hint">

    Pilih balok di bawah,
    lalu ketuk tempatnya di papan.

  </div>

</div>



<!-- POPUP GAME OVER -->

<div id="gameOver">

  <div class="popup">

    <h2>
      Game Over 😭
    </h2>

    <p>

      Skor kamu:

      <b id="finalScore">
        0
      </b>

    </p>

    <button onclick="newGame()">
      Main Lagi
    </button>

  </div>

</div>



<script>

/* =================================
   PENGATURAN GAME
================================= */

const SIZE = 8;


/* WARNA BALOK */

const COLORS = [

  "#ff5f7e",

  "#5f7cff",

  "#35c99a",

  "#ffc44d",

  "#a66cff",

  "#ff884d"

];


/* =================================
   BENTUK-BENTUK BALOK
================================= */

const SHAPES = [

  /* 1 */

  [
    [1]
  ],


  /* 2 HORIZONTAL */

  [
    [1,1]
  ],


  /* 2 VERTICAL */

  [
    [1],
    [1]
  ],


  /* 3 HORIZONTAL */

  [
    [1,1,1]
  ],


  /* 3 VERTICAL */

  [
    [1],
    [1],
    [1]
  ],


  /* KOTAK */

  [
    [1,1],
    [1,1]
  ],


  /* L */

  [
    [1,0],
    [1,1]
  ],


  /* L TERBALIK */

  [
    [0,1],
    [1,1]
  ],


  /* T */

  [
    [1,1,1],
    [0,1,0]
  ],


  /* Z */

  [
    [1,1,0],
    [0,1,1]
  ],


  /* 4 HORIZONTAL */

  [
    [1,1,1,1]
  ],


  /* 4 VERTICAL */

  [
    [1],
    [1],
    [1],
    [1]
  ],


  /* L PANJANG */

  [
    [1,1,1],
    [1,0,0]
  ],


  /* L PANJANG TERBALIK */

  [
    [1,1,1],
    [0,0,1]
  ]

];



/* =================================
   VARIABEL GAME
================================= */

let board = [];

let pieces = [];

let selectedPiece = -1;

let score = 0;



/* =================================
   MEMBUAT BALOK RANDOM
================================= */

function randomPiece() {

  const shape =

    SHAPES[
      Math.floor(
        Math.random() *
        SHAPES.length
      )
    ];


  const color =

    COLORS[
      Math.floor(
        Math.random() *
        COLORS.length
      )
    ];


  return {

    shape: shape.map(
      row => [...row]
    ),

    color: color

  };

}



/* =================================
   MEMULAI GAME BARU
================================= */

function newGame() {

  /*
    Membuat papan 8 x 8
    dalam keadaan kosong
  */

  board = [];

  for (
    let row = 0;
    row < SIZE;
    row++
  ) {

    board[row] = [];

    for (
      let col = 0;
      col < SIZE;
      col++
    ) {

      board[row][col] = null;

    }

  }


  /*
    Membuat 3 balok
  */

  pieces = [

    randomPiece(),

    randomPiece(),

    randomPiece()

  ];


  score = 0;

  selectedPiece = -1;


  document
    .getElementById("gameOver")
    .style.display = "none";


  render();

}



/* =================================
   MENAMPILKAN GAME
================================= */

function render() {

  renderScore();

  renderBoard();

  renderPieces();

}



/* =================================
   MENAMPILKAN SKOR
================================= */

function renderScore() {

  document
    .getElementById("score")
    .textContent =
      "Skor: " + score;

}



/* =================================
   MENAMPILKAN PAPAN
================================= */

function renderBoard() {

  const boardElement =

    document.getElementById(
      "board"
    );


  boardElement.innerHTML = "";


  for (
    let row = 0;
    row < SIZE;
    row++
  ) {

    for (
      let col = 0;
      col < SIZE;
      col++
    ) {

      const cell =

        document.createElement(
          "div"
        );


      cell.className = "cell";


      /*
        Kalau sudah ada balok
      */

      if (board[row][col]) {

        cell.classList.add(
          "filled"
        );

        cell.style.background =
          board[row][col];

      }


      /*
        Kalau kotak disentuh
      */

      cell.onclick = function() {

        putPiece(
          row,
          col
        );

      };


      boardElement.appendChild(
        cell
      );

    }

  }

}



/* =================================
   MENAMPILKAN 3 BALOK
================================= */

function renderPieces() {

  const piecesElement =

    document.getElementById(
      "pieces"
    );


  piecesElement.innerHTML = "";


  pieces.forEach(
    (piece, index) => {


      /*
        Kalau balok sudah digunakan
      */

      if (!piece) {

        const empty =
          document.createElement(
            "div"
          );

        empty.style.width = "30%";

        piecesElement.appendChild(
          empty
        );

        return;

      }


      const container =

        document.createElement(
          "div"
        );


      container.className =
        "piece";


      /*
        Balok sedang dipilih
      */

      if (
        selectedPiece === index
      ) {

        container.classList.add(
          "selected"
        );

      }


      const height =
        piece.shape.length;


      const width =
        piece.shape[0].length;


      container.style.gridTemplateColumns =

        `repeat(${width},25px)`;


      /*
        Membuat kotak-kotak
        dari bentuk balok
      */

      for (
        let y = 0;
        y < height;
        y++
      ) {

        for (
          let x = 0;
          x < width;
          x++
        ) {

          const mini =

            document.createElement(
              "div"
            );


          if (
            piece.shape[y][x]
          ) {

            mini.className =
              "mini";

            mini.style.background =
              piece.color;

          } else {

            mini.className =
              "mini empty";

          }


          container.appendChild(
            mini
          );

        }

      }


      /*
        Ketika balok ditekan
      */

      container.onclick =
        function() {

          selectedPiece = index;

          renderPieces();

        };


      piecesElement.appendChild(
        container
      );

    }

  );

}



/* =================================
   CEK BALOK BISA DITARUH ATAU TIDAK
================================= */

function canPut(
  shape,
  row,
  col
) {

  for (
    let y = 0;
    y < shape.length;
    y++
  ) {

    for (
      let x = 0;
      x < shape[y].length;
      x++
    ) {

      /*
        Bagian kosong
      */

      if (!shape[y][x]) {

        continue;

      }


      /*
        Keluar papan
      */

      if (

        row + y >= SIZE ||

        col + x >= SIZE

      ) {

        return false;

      }


      /*
        Sudah ditempati
      */

      if (
        board[row + y][col + x]
      ) {

        return false;

      }

    }

  }


  return true;

}



/* =================================
   MEMASUKKAN BALOK KE PAPAN
================================= */

function putPiece(
  row,
  col
) {

  /*
    Kalau belum memilih balok
  */

  if (
    selectedPiece === -1
  ) {

    return;

  }


  const piece =
    pieces[selectedPiece];


  /*
    Posisi tidak cocok
  */

  if (
    !canPut(
      piece.shape,
      row,
      col
    )
  ) {

    return;

  }


  let blockCount = 0;


  /*
    Masukkan balok
  */

  for (
    let y = 0;
    y < piece.shape.length;
    y++
  ) {

    for (
      let x = 0;
      x < piece.shape[y].length;
      x++
    ) {

      if (
        piece.shape[y][x]
      ) {

        board[
          row + y
        ][
          col + x
        ] = piece.color;


        blockCount++;

      }

    }

  }


  /*
    Tambah skor
  */

  score +=
    blockCount * 2;


  /*
    Balok sudah dipakai
  */

  pieces[selectedPiece] =
    null;


  selectedPiece = -1;


  /*
    Cek baris dan kolom
  */

  clearLines();


  /*
    Kalau 3 balok sudah habis,
    buat 3 balok baru
  */

  if (
    pieces.every(
      piece => piece === null
    )
  ) {

    pieces = [

      randomPiece(),

      randomPiece(),

      randomPiece()

    ];

  }


  render();


  /*
    Cek apakah masih ada
    tempat untuk bergerak
  */

  if (
    !hasPossibleMove()
  ) {

    showGameOver();

  }

}



/* =================================
   MENGHAPUS BARIS / KOLOM PENUH
================================= */

function clearLines() {

  let rows = [];

  let cols = [];


  /*
    Cek baris
  */

  for (
    let row = 0;
    row < SIZE;
    row++
  ) {

    if (
      board[row].every(
        cell => cell !== null
      )
    ) {

      rows.push(row);

    }

  }


  /*
    Cek kolom
  */

  for (
    let col = 0;
    col < SIZE;
    col++
  ) {

    let full = true;


    for (
      let row = 0;
      row < SIZE;
      row++
    ) {

      if (
        !board[row][col]
      ) {

        full = false;

        break;

      }

    }


    if (full) {

      cols.push(col);

    }

  }


  /*
    Hapus baris
  */

  rows.forEach(
    row => {

      for (
        let col = 0;
        col < SIZE;
        col++
      ) {

        board[row][col] =
          null;

      }

    }
  );


  /*
    Hapus kolom
  */

  cols.forEach(
    col => {

      for (
        let row = 0;
        row < SIZE;
        row++
      ) {

        board[row][col] =
          null;

      }

    }
  );


  /*
    Bonus skor
  */

  const total =
    rows.length +
    cols.length;


  if (total > 0) {

    score +=
      total * total * 10;

  }

}



/* =================================
   CEK APAKAH MASIH ADA GERAKAN
================================= */

function hasPossibleMove() {

  for (
    let i = 0;
    i < pieces.length;
    i++
  ) {

    const piece =
      pieces[i];


    if (!piece) {

      continue;

    }


    for (
      let row = 0;
      row < SIZE;
      row++
    ) {

      for (
        let col = 0;
        col < SIZE;
        col++
      ) {

        if (
          canPut(
            piece.shape,
            row,
            col
          )
        ) {

          return true;

        }

      }

    }

  }


  return false;

}



/* =================================
   GAME OVER
================================= */

function showGameOver() {

  document
    .getElementById(
      "finalScore"
    )
    .textContent = score;


  document
    .getElementById(
      "gameOver"
    )
    .style.display = "flex";

}



/* =================================
   JALANKAN GAME
================================= */

newGame();

</script>

</body>
</html>
