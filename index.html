<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #70c5ce;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
      touch-action: manipulation;
    }
    canvas {
      border: 2px solid #000;
      background-color: #70c5ce;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      max-width: 100%;
    }
    p {
      margin-top: 10px;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 2px #000;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas" width="320" height="480"></canvas>
  <p>Ketuk layar HP untuk terbang!</p>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let birdY = 200;
    let velocity = 0;
    let gravity = 0.35;
    let jump = -6;
    let score = 0;
    
    // Status Game: 'START' (Layar Awal), 'PLAYING' (Main), 'GAMEOVER' (Kalah)
    let gameState = 'START'; 

    let pipes = [];
    let frame = 0;

    function resetGame() {
      birdY = 200;
      velocity = 0;
      score = 0;
      pipes = [];
      frame = 0;
      gameState = 'PLAYING';
    }

    function draw() {
      // 1. Background
      ctx.fillStyle = "#70c5ce";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2. Logic saat GAME PLAYING
      if (gameState === 'PLAYING') {
        velocity += gravity;
        birdY += velocity;

        // Buat Pipa Baru
        if (frame % 90 === 0) {
          let topPipeHeight = Math.floor(Math.random() * 200) + 50;
          let gap = 120;
          pipes.push({
            x: canvas.width,
            top: topPipeHeight,
            bottom: canvas.height - topPipeHeight - gap
          });
        }

        // Gambar & Geser Pipa
        ctx.fillStyle = "green";
        for (let i = 0; i < pipes.length; i++) {
          let p = pipes[i];
          p.x -= 2;

          ctx.fillRect(p.x, 0, 40, p.top);
          ctx.fillRect(p.x, canvas.height - p.bottom, 40, p.bottom);

          // Cek Tabrakan
          if (
            (30 + 20 > p.x && 30 < p.x + 40) &&
            (birdY < p.top || birdY + 20 > canvas.height - p.bottom)
          ) {
            gameState = 'GAMEOVER';
          }

          // Tambah Skor
          if (p.x === 30) {
            score++;
          }
        }

        // Hapus pipa yang keluar layar
        if (pipes.length > 0 && pipes[0].x < -40) {
          pipes.shift();
        }

        // Cek Jatuh ke Bawah / Terlalu Tinggi
        if (birdY + 20 >= canvas.height || birdY <= 0) {
          gameState = 'GAMEOVER';
        }

        frame++;
      }

      // 3. Gambar Burung
      ctx.fillStyle = "yellow";
      ctx.beginPath();
      ctx.arc(40, birdY, 12, 0, Math.PI * 2);
      ctx.fill();

      // 4. Tampilan Skor
      ctx.fillStyle = "white";
      ctx.font = "20px Arial";
      ctx.fillText("Skor: " + score, 15, 30);

      // 5. LAYAR START (Tampilan Awal Sebelum Main)
      if (gameState === 'START') {
        ctx.fillStyle = "rgba(0,0,0,0.4)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "white";
        ctx.font = "bold 26px Arial";
        ctx.textAlign = "center";
        ctx.fillText("FLAPPY BIRD", canvas.width / 2, canvas.height / 2 - 30);
        
        ctx.font = "16px Arial";
        ctx.fillText("Ketuk Layar untuk Start!", canvas.width / 2, canvas.height / 2 + 20);
        ctx.textAlign = "start";
      }

      // 6. LAYAR GAME OVER (Saat Kalah)
      if (gameState === 'GAMEOVER') {
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "white";
        ctx.font = "bold 24px Arial";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
        
        ctx.font = "16px Arial";
        ctx.fillText("Skor Akhir: " + score, canvas.width / 2, canvas.height / 2 + 15);
        ctx.fillText("Ketuk untuk Main Lagi", canvas.width / 2, canvas.height / 2 + 50);
        ctx.textAlign = "start";
      }

      requestAnimationFrame(draw);
    }

    // Fungsi Kontrol Sentuhan Layar
    function action() {
      if (gameState === 'START') {
        resetGame();
      } else if (gameState === 'PLAYING') {
        velocity = jump;
      } else if (gameState === 'GAMEOVER') {
        resetGame();
      }
    }

    window.addEventListener("touchstart", action);
    window.addEventListener("mousedown", action);
    window.addEventListener("keydown", function(e) {
      if (e.code === "Space") action();
    });

    draw();
  </script>
</body>
</html>
