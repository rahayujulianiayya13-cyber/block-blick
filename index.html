<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird Game</title>
  <style>
    body {
      margin: 0;
      padding: 10px;
      background-color: #70c5ce;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
      box-sizing: border-box;
      touch-action: manipulation;
    }
    canvas {
      border: 2px solid #000;
      background-color: #70c5ce;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      max-width: 100%;
    }
    .btn-container {
      margin-top: 15px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      box-shadow: 0 4px #2e7d32;
      cursor: pointer;
    }
    button:active {
      box-shadow: 0 2px #2e7d32;
      transform: translateY(2px);
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas" width="320" height="420"></canvas>

  <div class="btn-container">
    <button id="startBtn">MULAI GAME 🚀</button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const startBtn = document.getElementById("startBtn");

    let birdY = 180;
    let velocity = 0;
    let gravity = 0.35;
    let jump = -6;
    let score = 0;
    
    // Status: 'START' (Belum Mulai), 'PLAYING' (Main), 'GAMEOVER' (Kalah)
    let gameState = 'START'; 

    let pipes = [];
    let frame = 0;

    function resetGame() {
      birdY = 180;
      velocity = 0;
      score = 0;
      pipes = [];
      frame = 0;
      gameState = 'PLAYING';
      startBtn.innerText = "GAME BERJALAN...";
      startBtn.disabled = true; // Matikan tombol saat game main
      startBtn.style.opacity = "0.6";
    }

    function triggerGameOver() {
      gameState = 'GAMEOVER';
      startBtn.innerText = "MAIN LAGI 🔄";
      startBtn.disabled = false; // Aktifkan lagi tombolnya pas kalah
      startBtn.style.opacity = "1";
    }

    function draw() {
      // Background
      ctx.fillStyle = "#70c5ce";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (gameState === 'PLAYING') {
        velocity += gravity;
        birdY += velocity;

        if (frame % 90 === 0) {
          let topPipeHeight = Math.floor(Math.random() * 180) + 40;
          let gap = 120;
          pipes.push({
            x: canvas.width,
            top: topPipeHeight,
            bottom: canvas.height - topPipeHeight - gap
          });
        }

        ctx.fillStyle = "green";
        for (let i = 0; i < pipes.length; i++) {
          let p = pipes[i];
          p.x -= 2;

          ctx.fillRect(p.x, 0, 40, p.top);
          ctx.fillRect(p.x, canvas.height - p.bottom, 40, p.bottom);

          // Cek Tabrakan Pipa
          if (
            (30 + 20 > p.x && 30 < p.x + 40) &&
            (birdY < p.top || birdY + 20 > canvas.height - p.bottom)
          ) {
            triggerGameOver();
          }

          if (p.x === 30) {
            score++;
          }
        }

        if (pipes.length > 0 && pipes[0].x < -40) {
          pipes.shift();
        }

        // Cek Jatuh
        if (birdY + 20 >= canvas.height || birdY <= 0) {
          triggerGameOver();
        }

        frame++;
      }

      // Gambar Burung
      ctx.fillStyle = "yellow";
      ctx.beginPath();
      ctx.arc(40, birdY, 12, 0, Math.PI * 2);
      ctx.fill();

      // Skor
      ctx.fillStyle = "white";
      ctx.font = "20px Arial";
      ctx.fillText("Skor: " + score, 15, 30);

      // Tampilan Belum Mulai (START)
      if (gameState === 'START') {
        ctx.fillStyle = "rgba(0,0,0,0.4)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "white";
        ctx.font = "bold 24px Arial";
        ctx.textAlign = "center";
        ctx.fillText("FLAPPY BIRD", canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = "14px Arial";
        ctx.fillText("Klik tombol 'MULAI GAME' di bawah", canvas.width / 2, canvas.height / 2 + 20);
        ctx.textAlign = "start";
      }

      // Tampilan Game Over
      if (gameState === 'GAMEOVER') {
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "white";
        ctx.font = "bold 24px Arial";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = "16px Arial";
        ctx.fillText("Skor Akhir: " + score, canvas.width / 2, canvas.height / 2 + 15);
        ctx.textAlign = "start";
      }

      requestAnimationFrame(draw);
    }

    // Tombol Khusus MULAI / MAIN LAGI
    startBtn.addEventListener("click", function() {
      if (gameState === 'START' || gameState === 'GAMEOVER') {
        resetGame();
      }
    });

    // KONTROL LOMPAT (Bisa ketuk layar/canvas, klik mouse, atau tombol Spasi)
    function jumpAction(e) {
      // Hanya lompat jika game sedang berjalan
      if (gameState === 'PLAYING') {
        // Mencegah lompat jika yang diklik adalah tombol start
        if (e.target !== startBtn) {
          velocity = jump;
        }
      }
    }

    window.addEventListener("touchstart", jumpAction);
    window.addEventListener("mousedown", jumpAction);
    window.addEventListener("keydown", function(e) {
      if (e.code === "Space") {
        e.preventDefault();
        jumpAction(e);
      }
    });

    draw();
  </script>
</body>
</html>
