<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #70c5ce;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
      touch-action: manipulation;
    }
    canvas {
      border: 2px solid #000;
      background-color: #70c5ce;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      max-width: 100%;
    }
    p {
      margin-top: 10px;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 2px #000;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas" width="320" height="480"></canvas>
  <p>Ketuk layar atau tekan Spasi untuk terbang!</p>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let birdY = 200;
    let velocity = 0;
    let gravity = 0.35;
    let jump = -6;
    let score = 0;
    let gameOver = false;

    let pipes = [];
    let frame = 0;

    function resetGame() {
      birdY = 200;
      velocity = 0;
      score = 0;
      pipes = [];
      gameOver = false;
    }

    function draw() {
      // Background
      ctx.fillStyle = "#70c5ce";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (!gameOver) {
        // Update Burung
        velocity += gravity;
        birdY += velocity;

        // Pipa Baru
        if (frame % 90 === 0) {
          let topPipeHeight = Math.floor(Math.random() * 200) + 50;
          let gap = 120;
          pipes.push({
            x: canvas.width,
            top: topPipeHeight,
            bottom: canvas.height - topPipeHeight - gap
          });
        }

        // Move & Draw Pipa
        ctx.fillStyle = "green";
        for (let i = 0; i < pipes.length; i++) {
          let p = pipes[i];
          p.x -= 2;

          // Pipa Atas
          ctx.fillRect(p.x, 0, 40, p.top);
          // Pipa Bawah
          ctx.fillRect(p.x, canvas.height - p.bottom, 40, p.bottom);

          // Cek Tabrakan
          if (
            (30 + 20 > p.x && 30 < p.x + 40) &&
            (birdY < p.top || birdY + 20 > canvas.height - p.bottom)
          ) {
            gameOver = true;
          }

          // Skor
          if (p.x === 30) {
            score++;
          }
        }

        // Hapus Pipa Lewat
        if (pipes.length > 0 && pipes[0].x < -40) {
          pipes.shift();
        }

        // Cek Jatuh
        if (birdY + 20 >= canvas.height || birdY <= 0) {
          gameOver = true;
        }

        frame++;
      }

      // Draw Burung
      ctx.fillStyle = "yellow";
      ctx.beginPath();
      ctx.arc(40, birdY, 12, 0, Math.PI * 2);
      ctx.fill();

      // Draw Skor
      ctx.fillStyle = "white";
      ctx.font = "20px Arial";
      ctx.fillText("Skor: " + score, 15, 30);

      // Game Over Screen
      if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "white";
        ctx.font = "24px Arial";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = "16px Arial";
        ctx.fillText("Ketuk untuk Main Lagi", canvas.width / 2, canvas.height / 2 + 30);
        ctx.textAlign = "start";
      }

      requestAnimationFrame(draw);
    }

    function action() {
      if (gameOver) {
        resetGame();
      } else {
        velocity = jump;
      }
    }

    window.addEventListener("touchstart", action);
    window.addEventListener("mousedown", action);
    window.addEventListener("keydown", function(e) {
      if (e.code === "Space") action();
    });

    draw();
  </script>
</body>
</html>
