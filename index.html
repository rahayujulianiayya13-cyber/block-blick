<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flappy Bird Game</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            text-align: center;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        #game-area {
            position: relative;
            width: 360px;
            height: 640px;
            background-color: #70c5ce;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        #bird {
            position: absolute;
            width: 36px;
            height: 26px;
            background-color: #f1c40f;
            border-radius: 50%;
            left: 50px;
            top: 250px;
            z-index: 10;
            transform: rotate(-10deg);
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }

        #bird::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 8px;
            background-color: #e67e22;
            border-radius: 0 100% 0 0;
            right: -6px;
            top: 8px;
        }

        .pipe {
            position: absolute;
            width: 60px;
            background-color: #2ecc71;
            border: 4px solid #fff;
            border-radius: 8px;
        }

        #score-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 60px;
            font-weight: 800;
            color: white;
            text-shadow: 0 5px 0 rgba(0,0,0,0.2);
            z-index: 20;
        }

        /* --- LAYAR MENU & PETUNJUK --- */
        #message-screen {
            display: flex;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            padding: 20px;
        }

        #message-screen h1 {
            font-size: 38px;
            color: #f1c40f;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }

        .btn {
            width: 80%;
            padding: 12px 20px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin: 8px 0;
            transition: all 0.1s ease;
        }

        .btn-start {
            background-color: #2ecc71;
            color: white;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.4);
        }

        .btn-guide {
            background-color: #e67e22;
            color: white;
            box-shadow: 0 4px 10px rgba(230, 126, 34, 0.4);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Modal Petunjuk */
        #guide-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 40;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .modal-body {
            background: white;
            color: #333;
            padding: 20px;
            border-radius: 15px;
            text-align: left;
        }

        .modal-body h3 {
            text-align: center;
            margin-top: 0;
            color: #2c3e50;
        }

        .modal-body ul {
            padding-left: 20px;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div id="game-area">
        <div id="bird"></div>

        <div id="score-container">
            <span id="score">0</span>
        </div>

        <div id="message-screen">
            <h1>FLAPPY BIRD</h1>
            <p id="sub-title" style="margin-bottom: 20px; color: #ddd;">Siap Bermain?</p>
            <button class="btn btn-start" id="start-btn">Mulai Game 🚀</button>
            <button class="btn btn-guide" onclick="openGuide()">Cara Bermain 📖</button>
        </div>

        <div id="guide-modal">
            <div class="modal-body">
                <h3>📖 Cara Bermain</h3>
                <ul>
                    <li><strong>HP:</strong> Ketuk (tap) layar untuk membuat burung mengepakkan sayap dan melompat ke atas.</li>
                    <li><strong>Laptop:</strong> Klik mouse atau tekan tombol <strong>Spacebar</strong>.</li>
                    <li>Jaga agar burung tidak menabrak pipa hijau atau jatuh ke tanah!</li>
                </ul>
                <button class="btn btn-start" style="width: 100%; margin-top: 10px;" onclick="closeGuide()">Paham 👍</button>
            </div>
        </div>
    </div>

    <script>
        const gameArea = document.getElementById("game-area");
        const bird = document.getElementById("bird");
        const scoreSpan = document.getElementById("score");
        const messageScreen = document.getElementById("message-screen");
        const startBtn = document.getElementById("start-btn");
        const guideModal = document.getElementById("guide-modal");

        const GAME_WIDTH = 360;
        const GAME_HEIGHT = 640;

        let isGameRunning = false;
        let score = 0;
        let gravity = 0.5;
        let jumpPower = -8.5;
        let birdY = 250;
        let birdVelocity = 0;
        let pipes = [];
        let pipeGap = 160;
        let pipeWidth = 60;
        let pipeSpeed = 2.5;
        let gameLoopId = null;

        function openGuide() { guideModal.style.display = "flex"; }
        function closeGuide() { guideModal.style.display = "none"; }

        function startGame() {
            isGameRunning = true;
            score = 0;
            scoreSpan.innerText = score;
            messageScreen.style.display = "none";

            birdY = 250;
            birdVelocity = 0;
            bird.style.top = birdY + "px";

            pipes.forEach(pipe => pipe.element.remove());
            pipes = [];

            clearInterval(gameLoopId);
            gameLoopId = setInterval(gameTick, 1000 / 60);
        }

        function gameOver() {
            isGameRunning = false;
            clearInterval(gameLoopId);
            messageScreen.style.display = "flex";
            messageScreen.querySelector("h1").innerText = "GAME OVER!💥";
            document.getElementById("sub-title").innerText = "Skor Akhir: " + score;
            startBtn.innerText = "Main Lagi 🔁";
        }

        function handleJump(e) {
            if (!isGameRunning) return;
            birdVelocity = jumpPower;
        }

        gameArea.addEventListener("mousedown", handleJump);
        gameArea.addEventListener("touchstart", function(e) { handleJump(e); e.preventDefault(); }, {passive: false});
        document.addEventListener("keydown", function(e) {
            if (e.code === "Space") handleJump(e);
        });
        startBtn.addEventListener("click", function(e) { e.stopPropagation(); startGame(); });

        function gameTick() {
            if (!isGameRunning) return;

            birdVelocity += gravity;
            birdY += birdVelocity;
            bird.style.top = birdY + "px";

            if (birdY < 0 || birdY + 26 > GAME_HEIGHT) {
                gameOver();
                return;
            }

            pipes.forEach((pipe, index) => {
                pipe.x -= pipeSpeed;
                pipe.element.style.left = pipe.x + "px";

                if (pipe.x < 50 + 36 && pipe.x + pipeWidth > 50) {
                    if (birdY < pipe.topHeight || birdY + 26 > pipe.bottomTop) {
                        gameOver();
                        return;
                    }
                }

                if (pipe.x + pipeWidth < 50 && !pipe.passed) {
                    score++;
                    scoreSpan.innerText = score;
                    pipe.passed = true;
                }

                if (pipe.x + pipeWidth < 0) {
                    pipe.element.remove();
                    pipes.splice(index, 1);
                }
            });

            if (pipes.length === 0 || pipes[pipes.length - 1].x < GAME_WIDTH - 200) {
                createPipeSet();
            }
        }

        function createPipeSet() {
            const minHeight = 60;
            const maxHeight = GAME_HEIGHT - pipeGap - minHeight;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            const pipeTop = document.createElement("div");
            pipeTop.className = "pipe";
            pipeTop.style.width = pipeWidth + "px";
            pipeTop.style.height = topHeight + "px";
            pipeTop.style.left = GAME_WIDTH + "px";
            pipeTop.style.top = "0px";
            gameArea.appendChild(pipeTop);

            const pipeBottomHeight = GAME_HEIGHT - topHeight - pipeGap;
            const pipeBottom = document.createElement("div");
            pipeBottom.className = "pipe";
            pipeBottom.style.width = pipeWidth + "px";
            pipeBottom.style.height = pipeBottomHeight + "px";
            pipeBottom.style.left = GAME_WIDTH + "px";
            pipeBottom.style.bottom = "0px";
            gameArea.appendChild(pipeBottom);

            pipes.push({
                x: GAME_WIDTH,
                topHeight: topHeight,
                bottomTop: topHeight + pipeGap,
                passed: false,
                element: pipeTop
            });
        }
    </script>

</body>
</html>
