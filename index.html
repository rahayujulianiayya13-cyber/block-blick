<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hungry Shark Game</title>
  <style>
    body {
      margin: 0;
      padding: 10px;
      background: linear-gradient(to bottom, #001e3d, #000814);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      box-sizing: border-box;
      touch-action: manipulation;
      color: white;
    }
    canvas {
      border: 3px solid #00b4d8;
      border-radius: 12px;
      background: linear-gradient(to bottom, #0077b6, #03045e);
      box-shadow: 0 8px 20px rgba(0, 180, 216, 0.4);
      max-width: 100%;
    }
    .btn-container {
      margin-top: 15px;
    }
    button {
      background: linear-gradient(135deg, #ff4d6d, #c9184a);
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 25px;
      box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
      cursor: pointer;
      transition: all 0.2s;
    }
    button:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas" width="340" height="460"></canvas>

  <div class="btn-container">
    <button id="startBtn">MULAI GAME 🦈</button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const startBtn = document.getElementById("startBtn");

    // Sound Generator (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playEatSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    function playExplodeSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    // State Variables
    let sharkY = 200;
    let sharkVelocity = 0;
    let gravity = 0.25;
    let swimUp = -4.5;
    let score = 0;
    let isSwimming = false;
    let gameState = 'START'; // 'START', 'PLAYING', 'GAMEOVER'

    let meats = [];
    let bombs = [];
    let bubbles = [];
    let frame = 0;

    // Buat Gelembung Air Background
    for (let i = 0; i < 15; i++) {
      bubbles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 4 + 1,
        speed: Math.random() * 1 + 0.5
      });
    }

    function resetGame() {
      sharkY = 200;
      sharkVelocity = 0;
      score = 0;
      meats = [];
      bombs = [];
      frame = 0;
      gameState = 'PLAYING';
      startBtn.innerText = "BERENANG... 🌊";
      startBtn.disabled = true;
      startBtn.style.opacity = "0.5";
    }

    function triggerGameOver() {
      playExplodeSound();
      gameState = 'GAMEOVER';
      startBtn.innerText = "MAIN LAGI 🔄";
      startBtn.disabled = false;
      startBtn.style.opacity = "1";
    }

    // Gambar Hiu
    function drawShark(x, y) {
      ctx.save();
      ctx.translate(x, y);

      // Badan Hiu
      ctx.fillStyle = "#90e0ef";
      ctx.beginPath();
      ctx.ellipse(0, 0, 25, 15, 0, 0, Math.PI * 2);
      ctx.fill();

      // Sirip Atas
      ctx.fillStyle = "#00b4d8";
      ctx.beginPath();
      ctx.moveTo(-5, -12);
      ctx.lineTo(5, -22);
      ctx.lineTo(8, -10);
      ctx.closePath();
      ctx.fill();

      // Ekor
      ctx.beginPath();
      ctx.moveTo(-22, 0);
      ctx.lineTo(-35, -12);
      ctx.lineTo(-30, 0);
      ctx.lineTo(-35, 12);
      ctx.closePath();
      ctx.fill();

      // Mata
      ctx.fillStyle = "black";
      ctx.beginPath();
      ctx.arc(12, -4, 3, 0, Math.PI * 2);
      ctx.fill();

      // Mulut & Gigi
      ctx.fillStyle = "#d90429";
      ctx.beginPath();
      ctx.arc(12, 4, 8, 0, Math.PI);
      ctx.fill();

      ctx.fillStyle = "white";
      ctx.beginPath();
      ctx.moveTo(10, 4);
      ctx.lineTo(13, 9);
      ctx.lineTo(16, 4);
      ctx.fill();

      ctx.restore();
    }

    function draw() {
      // 1. Background Laut
      ctx.fillStyle = "#0077b6";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Animasi Gelembung
      ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
      bubbles.forEach(b => {
        b.y -= b.speed;
        if (b.y < 0) b.y = canvas.height;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      });

      if (gameState === 'PLAYING') {
        // Gravitasi Hiu
        if (isSwimming) {
          sharkVelocity = swimUp;
        } else {
          sharkVelocity += gravity;
        }
        sharkY += sharkVelocity;

        // Batas Layar
        if (sharkY < 20) sharkY = 20;
        if (sharkY > canvas.height - 20) triggerGameOver();

        // Spawn Daging (Item Tambah Skor)
        if (frame % 80 === 0) {
          meats.push({
            x: canvas.width + 20,
            y: Math.floor(Math.random() * (canvas.height - 100)) + 50
          });
        }

        // Spawn Bom (Ranjau)
        if (frame % 130 === 0) {
          bombs.push({
            x: canvas.width + 20,
            y: Math.floor(Math.random() * (canvas.height - 100)) + 50
          });
        }

        // Olah Daging
        for (let i = meats.length - 1; i >= 0; i--) {
          let m = meats[i];
          m.x -= 2.5;

          // Gambar Daging
          ctx.fillStyle = "#ef233c";
          ctx.beginPath();
          ctx.arc(m.x, m.y, 10, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#white";
          ctx.fillRect(m.x - 4, m.y - 2, 8, 4);

          // Cek Dimakan Hiu
          let dist = Math.hypot(50 - m.x, sharkY - m.y);
          if (dist < 30) {
            playEatSound();
            score += 10;
            meats.splice(i, 1);
          } else if (m.x < -20) {
            meats.splice(i, 1);
          }
        }

        // Olah Bom
        for (let i = bombs.length - 1; i >= 0; i--) {
          let b = bombs[i];
          b.x -= 3;

          // Gambar Ranjau Laut
          ctx.fillStyle = "#212529";
          ctx.beginPath();
          ctx.arc(b.x, b.y, 12, 0, Math.PI * 2);
          ctx.fill();
          // Duri Bom
          ctx.strokeStyle = "#d90429";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(b.x - 16, b.y); ctx.lineTo(b.x + 16, b.y);
          ctx.moveTo(b.x, b.y - 16); ctx.lineTo(b.x, b.y + 16);
          ctx.stroke();

          // Cek Tabrak Bom
          let dist = Math.hypot(50 - b.x, sharkY - b.y);
          if (dist < 28) {
            triggerGameOver();
          } else if (b.x < -20) {
            bombs.splice(i, 1);
          }
        }

        frame++;
      }

      // Gambar Hiu Utama
      drawShark(50, sharkY);

      // Tampilan Skor
      ctx.fillStyle = "#ffb703";
      ctx.font = "bold 20px Arial";
      ctx.fillText("SKOR: " + score, 15, 35);

      // Layar Awal (START)
      if (gameState === 'START') {
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#48cae4";
        ctx.font = "bold 26px Arial";
        ctx.textAlign = "center";
        ctx.fillText("HUNGRY SHARK 🦈", canvas.width / 2, canvas.height / 2 - 30);

        ctx.fillStyle = "white";
        ctx.font = "14px Arial";
        ctx.fillText("Makan Daging 🥩 (+10 Skor)", canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillText("Hindari Ranjau 💣", canvas.width / 2, canvas.height / 2 + 35);
        ctx.fillText("Tekan 'MULAI GAME' di bawah!", canvas.width / 2, canvas.height / 2 + 70);
        ctx.textAlign = "start";
      }

      // Layar Game Over
      if (gameState === 'GAMEOVER') {
        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ff4d6d";
        ctx.font = "bold 28px Arial";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER!", canvas.width / 2, canvas.height / 2 - 20);

        ctx.fillStyle = "white";
        ctx.font = "18px Arial";
        ctx.fillText("Skor Akhir: " + score, canvas.width / 2, canvas.height / 2 + 20);
        ctx.textAlign = "start";
      }

      requestAnimationFrame(draw);
    }

    // Tombol Start
    startBtn.addEventListener("click", function() {
      if (gameState === 'START' || gameState === 'GAMEOVER') {
        resetGame();
      }
    });

    // Kontrol Berenang (Tahan Layar / Spasi untuk Naik)
    function startSwim(e) {
      if (gameState === 'PLAYING' && e.target !== startBtn) {
        isSwimming = true;
      }
    }

    function stopSwim(e) {
      isSwimming = false;
    }

    window.addEventListener("touchstart", startSwim);
    window.addEventListener("touchend", stopSwim);
    window.addEventListener("mousedown", startSwim);
    window.addEventListener("mouseup", stopSwim);
    window.addEventListener("keydown", function(e) {
      if (e.code === "Space") startSwim(e);
    });
    window.addEventListener("keyup", function(e) {
      if (e.code === "Space") stopSwim(e);
    });

    draw();
  </script>
</body>
</html>
